name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload tested Pages build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  python:
    # Python 3.9 is not in the ubuntu-latest (26.04) tool cache; 22.04 still has it.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install pytest
      - run: pytest python/tests -q
        env: { PYTHONPATH: python }
  geomcore-latest:
    # The adapter and examples against the newest geomcore on PyPI: the current
    # class names and API (0.44+) must not break a fresh install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --upgrade geomcore pytest
      - run: pytest python/tests -q
        env: { PYTHONPATH: python }
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
        working-directory: frontend
      - run: scripts/bundle-frontend.sh
      - run: pip install build && python -m build python/
      - run: pip install --no-deps python/dist/*.whl
      - name: Smoke-test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import urlopen

          from geomcore_viewer.server import Server

          class Page(HTMLParser):
              scripts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script" and "src" in attrs:
                      self.scripts.append(attrs["src"])

          with Server(port=0) as server:
              page = Page()
              with urlopen(server.url, timeout=5) as response:
                  page.feed(response.read().decode())
              assert page.scripts, "Bundled viewer HTML has no scripts"
              for script in page.scripts:
                  with urlopen(urljoin(server.url, script), timeout=5) as response:
                      assert response.read(), f"Empty script: {script}"
          PY
  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: clients/rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo test --locked --features geomcore
      - run: cargo clippy --locked --all-targets --features geomcore -- -D warnings
      - run: scripts/rust-live-check.sh 8797   # the examples against a real server
        working-directory: .

  pages:
    if: github.ref == 'refs/heads/main'
    needs: [frontend, e2e, python, geomcore-latest, wheel, rust]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
