name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install pytest
      - run: pytest python/tests -q
        env: { PYTHONPATH: python }
  geomcore-latest:
    # The adapter and examples against the newest geomcore on PyPI: the class-name renames
    # (0.39) and API moves (0.43) must not break a fresh install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --upgrade geomcore pytest
      - run: pytest python/tests -q
        env: { PYTHONPATH: python }
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
        working-directory: frontend
      - run: scripts/bundle-frontend.sh
      - run: pip install build && python -m build python/
      - run: unzip -Z1 python/dist/*.whl | grep -x 'geomcore_viewer/_frontend/index.html'
  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: clients/rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo test --features geomcore
      - run: cargo clippy --all-targets --features geomcore -- -D warnings
      - run: scripts/rust-live-check.sh 8797   # the examples against a real server
        working-directory: .
