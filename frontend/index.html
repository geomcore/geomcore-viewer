<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23d1495b' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23d1495b'/%3E%3C/svg%3E" />
    <title>geomcore-viewer</title>
  </head>
  <body>
    <header id="chrome">
      <h1 id="title">geomcore-viewer</h1>
      <span id="status" role="status">connecting…</span>
      <span id="run" class="meta"></span>
      <span id="count" class="meta"></span>
      <div class="spacer"></div>
      <div class="seg" id="step-bar" role="group" aria-label="step" hidden>
        <input type="range" id="step-slider" min="0" max="0" step="1" aria-label="step" />
        <span id="step-label" class="meta"></span>
        <span class="seg" role="group" aria-label="step buttons">
          <button id="step-previous" title="Previous step (←)">‹</button><button id="step-next" title="Next step (→)">›</button>
        </span>
      </div>
      <div class="actions">
        <button id="objects" aria-controls="panel" aria-expanded="false">Objects</button>
        <button id="uv-toggle" aria-controls="surface-domain" aria-pressed="false" title="Toggle parameter domain (U)" hidden>UV</button>
        <label class="check" title="Frame the scene as it changes"><input type="checkbox" id="autofit" checked /> auto-fit</label>
        <label class="check" title="Show object labels (axis ticks stay)"><input type="checkbox" id="labels" checked /> labels</label>
        <button id="fit" title="Fit the scene (F)">fit</button>
        <button id="theme" title="Light or dark (T)">theme</button>
        <button id="present" title="Presentation mode (P)">present</button>
        <button id="clear" title="Clear the scene">clear</button>
      </div>
    </header>
    <main>
      <section id="stage" data-view="2d" aria-label="Geometry">
        <div id="view3d"></div>
        <div id="view2d"></div>
        <div id="toast" role="status" hidden></div>
      </section>
      <aside id="panel" aria-label="Scene objects">
        <ul id="object-list"></ul>
        <p class="hint">
          <kbd>F</kbd> fit · <kbd>P</kbd> present · <kbd>T</kbd> theme · <kbd>U</kbd> (u,v) pane ·
          <kbd>Esc</kbd> leave / deselect · hover for details, click a point to copy it
        </p>
        <p class="hint">Live via SSE when served locally · <code>?scene=&lt;url&gt;</code> · or drop a <code>.json</code> scene file anywhere.</p>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
