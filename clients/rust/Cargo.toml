[package]
name = "geomcore-viewer"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust client for the geomcore-viewer live browser viewer (scene protocol v2)."
repository = "https://github.com/geomcore/geomcore-viewer"
readme = "README.md"
keywords = ["geometry", "cad", "visualization", "viewer", "geomcore"]
categories = ["visualization", "mathematics"]

[features]
# Convert geomcore's curves, surfaces and points to `Geom` (needs Rust 1.85+, geomcore's edition 2024).
geomcore = ["dep:geomcore"]

[dependencies]
serde_json = "1"
geomcore = { version = "0.36", optional = true }

[[example]]
name = "conics"
required-features = ["geomcore"]

[[example]]
name = "pcurve"
required-features = ["geomcore"]
